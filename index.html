<!DOCTYPE html>
<html>

<head>
    <title>My Portfolio</title>

    <style>
        body {
            background-color: #FFFFFF;
            color: #000000;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .portfolio {
            width: 70%;
            margin: 30px auto;
            padding: 40px;
            background-color: #FFFFFF;
            min-height: 600px;
        }

        img {
            width: 80px;
            border-radius: 50%;
        }

        h1 {
            font-size: 40px;
            margin: 20px;
            color: #000000;
        }

        p {
            color: #000000;
            font-size: 18px;
        }

        h2 {
            margin: 40px;
            padding-bottom: 15px;
            border-bottom: 1px solid #000000;
            color: #000000;
        }

        .social {
            margin-top: 60px;
        }

        .social h3 {
            color: #000000;
        }

        .social a {
            color: #000000;
            margin: 15px;
            text-decoration: none;
        }

        footer {
            margin-top: 50px;
            color: #000000;
        }
    </style>

</head>

<body>

    <div class="portfolio">

        <!-- Logo -->
        <img src="assests/me.jpeg" alt="My Logo">

        <!-- Portfolio Heading -->
        <h1>My Portfolio</h1>

        <p>
            Welcome to my portfolio. Here you can learn about me,
            my skills, my projects, and how to contact me.
        </p>

        <!-- Portfolio Sections -->
        <h2>About Me</h2>

        <h2>My Skills</h2>

        <h2>My Projects</h2>

        <h2>Contact</h2>

        <!-- Social Links -->
        <div class="social">

            <h3>Find Me On</h3>

            <a href="#">
                <img src="assests/gmail.jpeg" alt="Email">
            </a>

            <a href="#">
                <img src="assests/linkdin.jpeg" alt="LinkedIn">
            </a>

            <a href="#">
                <img src="assests/github.jpeg" alt="GitHub">
            </a>

            <a href="#">
                <img src="assests/whatsapp.jpeg" alt="WhatsApp">
            </a>

        </div>

        <!-- Footer -->
        <footer>
            <p>Copyright © 2026. All Rights Reserved.</p>
        </footer>

    </div>

</body>

</html>
